<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex-shrink: 0; margin: 0 8px 6px; height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 8px; background: var(--pbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--phl)">
<div style="width: 46px; height: 46px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--abd); background: repeating-linear-gradient(135deg, var(--art1) 0 5px, var(--art2) 5px 10px); box-shadow: var(--shn)"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600; color: var(--tp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Polygon Weather</span>
<span style="font-size: 13px; font-weight: 600; color: var(--acb); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Aphelion Drive</span>
</div>
<div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0">
<div aria-label="Previous" style="width: 44px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<div style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 1px solid var(--cfb); background: var(--cf); color: var(--cin); display: flex; align-items: center; justify-content: center; box-shadow: var(--shc)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v14"></path><path d="M18 5.5L8.5 12l9.5 6.5z" fill="currentColor"></path></svg>
</div>
</div>
<div aria-label="Play/Pause" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 1px solid var(--cfb); background: var(--cf); color: var(--acp); display: flex; align-items: center; justify-content: center; box-shadow: var(--shc), 0 0 0 1px var(--cpr), var(--glow)">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"></rect></svg>
</div>
</div>
<div aria-label="Next" style="width: 44px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center">
<div style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; border: 1px solid var(--cfb); background: var(--cf); color: var(--cin); display: flex; align-items: center; justify-content: center; box-shadow: var(--shc)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5v14"></path><path d="M6 5.5L15.5 12L6 18.5z" fill="currentColor"></path></svg>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:384,&quot;height&quot;:80}}"></script>
</body>
</html>
