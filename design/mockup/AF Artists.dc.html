<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--wbg); background-image: var(--tgl); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: var(--tp); overflow: hidden">
<div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; font-weight: 600; color: var(--tp)"><span>9:41</span><span>87%</span></div>
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px">
<div role="button" aria-label="Menu" style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
<img src="assets/PlayStation-Logo-1994.png" alt="" style="width: 36px; height: 28px; object-fit: contain">
</div>
<div style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--pbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--shs); color: var(--tm)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="font-size: 15px; color: var(--tph)">Search</span>
</div>
</div>
<div style="flex: 1; min-height: 0; margin: 0 8px 6px; display: flex; flex-direction: column; background: var(--pbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--phl); overflow: hidden">
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--pdv)">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--tm)">ARTISTS</span>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px; overflow: hidden">
<sc-for list="{{ artists }}" as="a" hint-placeholder-count="10">
<div style="height: 64px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 4px 8px; border-radius: 3px; background: {{ a.bg }}">
<div style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; border: 1px solid {{ a.thumb }}; background: repeating-linear-gradient(135deg, var(--art1) 0 5px, var(--art2) 5px 10px)"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; color: var(--tp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.name }}</span>
<span style="font-size: 13px; color: {{ a.sub }}">{{ a.count }}</span>
</div>
</div>
</sc-for>
</div>
</div>
<dc-import name="AF Mini Player" hint-size="100%,70px"></dc-import>
<div style="height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><div style="width: 108px; height: 4px; border-radius: 2px; background: var(--tm)"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:384,&quot;height&quot;:832}}">
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Aeon Static', '1 album'], ['Aphelion Drive', '3 albums'], ['Bitcrush Quartet', '2 albums'],
      ['Dual Shock Ensemble', '1 album'], ['Emotion Engine', '1 album'], ['Fifth Generation', '1 album'],
      ['Grey Chassis', '1 album'], ['Hyperblast Choir', '4 albums'], ['Memory Card Club', '2 albums'],
      ['The Polygon Set', '3 albums'], ['Redbook Audio', '1 album'], ['Scanline', '2 albums'],
      ['Vibration Function', '1 album']
    ];
    return {
      artists: rows.map(([name, count]) => {
        const sel = name === 'Aphelion Drive';
        return { name, count, bg: sel ? 'var(--sel)' : 'transparent', sub: sel ? 'var(--ts)' : 'var(--tm)', thumb: sel ? 'var(--atbs)' : 'var(--atb)' };
      })
    };
  }
}
</script>
</body>
</html>
