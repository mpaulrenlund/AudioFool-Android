<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--wbg); background-image: var(--tgl); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: var(--tp); overflow: hidden">
<div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; font-weight: 600; color: var(--tp)"><span>9:41</span><span>87%</span></div>
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 12px">
<div style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 4px 0 12px; background: var(--sfbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--shs), 0 0 0 2px var(--acp); color: var(--tm)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<span style="flex: 1; font-size: 15px; color: var(--tp)">polygon</span>
<div style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--tm)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10"></path><path d="M17 7L7 17"></path></svg>
</div>
</div>
</div>
<div style="flex: 1; min-height: 0; margin: 0 8px 6px; display: flex; flex-direction: column; background: var(--pbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--phl); overflow: hidden">
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--pdv)"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--tm)">ARTISTS</span></div>
<div style="padding: 6px; display: flex; flex-direction: column">
<div style="height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; border-radius: 3px">
<span style="font-size: 16px; color: var(--tp)">The Polygon Set</span>
<span style="font-size: 13px; color: var(--tm)">3 albums</span>
</div>
</div>
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--pdv); border-bottom: 1px solid var(--pdv)"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--tm)">ALBUMS</span></div>
<div style="padding: 6px; display: flex; flex-direction: column">
<sc-for list="{{ albums }}" as="al" hint-placeholder-count="2">
<div style="height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 4px 8px; border-radius: 3px">
<div style="width: 64px; height: 64px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--atb); background: repeating-linear-gradient(135deg, var(--art1) 0 5px, var(--art2) 5px 10px)"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; line-height: 1.3; color: var(--tp)">{{ al.title }}</span>
<span style="font-size: 13px; color: var(--tm)">{{ al.meta }}</span>
</div>
</div>
</sc-for>
</div>
<div style="height: 36px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid var(--pdv); border-bottom: 1px solid var(--pdv)"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: var(--tm)">SONGS</span></div>
<div style="flex: 1; min-height: 0; padding: 6px 8px; display: flex; flex-direction: column; overflow: hidden">
<sc-for list="{{ songs }}" as="s" hint-placeholder-count="3">
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 3px; background: {{ s.bg }}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: {{ s.weight }}; color: {{ s.fg }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.title }}</span>
<span style="font-size: 13px; color: {{ s.sub }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.from }}</span>
</div>
<span style="width: 40px; text-align: right; font-size: 14px; color: {{ s.sub }}; font-variant-numeric: tabular-nums">{{ s.time }}</span>
</div>
</sc-for>
</div>
</div>
<dc-import name="AF Mini Player" hint-size="100%,70px"></dc-import>
<div style="height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><div style="width: 108px; height: 4px; border-radius: 2px; background: var(--tm)"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:384,&quot;height&quot;:832}}">
class Component extends DCLogic {
  renderVals() {
    const songs = [
      ['Polygon Weather', 'Aphelion Drive · Second Sight', 'FLAC', '5:32', true],
      ['Polygon Count', 'The Polygon Set · Polygon Count', 'FLAC', '3:47'],
      ['Low Polygon Lullaby', 'Grey Chassis · Idle Animation', 'MP3', '4:12']
    ].map(([title, from, kind, time, np]) => ({
      title, from, kind, time, bg: np ? 'var(--npbg)' : 'transparent', weight: np ? 600 : 400,
      fg: np ? 'var(--acpt)' : 'var(--tp)', sub: np ? 'var(--acpt)' : 'var(--ts)'
    }));
    return { albums: [{ title: 'Polygon Count', meta: 'The Polygon Set · 2003 · 11 tracks' }], songs };
  }
}
</script>
</body>
</html>
