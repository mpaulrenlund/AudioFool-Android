<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--wbg); background-image: var(--tgl); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: var(--tp); overflow: hidden">
<div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 13px; font-weight: 600; color: var(--tp)"><span>9:41</span><span>87%</span></div>
<div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 16px">
<span style="flex: 1; min-width: 0; font-size: 15px; color: var(--tm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Aphelion Drive</span>
<div style="width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--tm)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
</div>
</div>
<div style="flex: 1; min-height: 0; margin: 0 8px 6px; display: flex; flex-direction: column; background: var(--pbg); border: 1px solid var(--pbd); border-radius: 4px; box-shadow: var(--phl); overflow: hidden">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 14px 14px; border-bottom: 1px solid var(--pdv)">
<div style="width: 72px; height: 72px; flex-shrink: 0; box-sizing: border-box; border: 1px solid var(--abd); background: repeating-linear-gradient(135deg, var(--art1) 0 6px, var(--art2) 6px 12px); box-shadow: var(--sha)"></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 21px; font-weight: 600; line-height: 1.15; color: var(--th); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Second Sight</span>
<span style="font-size: 14px; font-weight: 600; color: var(--acb)">Aphelion Drive</span>
<span style="font-size: 13px; color: var(--ts); font-variant-numeric: tabular-nums">1997 · 10 tracks · 42:58</span>
</div>
</div>
<div style="height: 34px; flex-shrink: 0; box-sizing: border-box; display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; column-gap: 10px; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--pdv); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--tm); white-space: nowrap">
<span style="text-align: right">#</span>
<span>SONG</span>
<span style="text-align: right">TIME</span>
</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 8px; overflow: hidden">
<sc-for list="{{ tracks }}" as="t" hint-placeholder-count="10">
<div style="height: 48px; flex-shrink: 0; display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; column-gap: 10px; align-items: center; padding: 0 8px; border-radius: 3px; background: {{ t.bg }}; font-size: 14px; font-weight: {{ t.weight }}; color: {{ t.sub }}; white-space: nowrap">
<span style="display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 14px; color: {{ t.num }}; font-variant-numeric: tabular-nums">
<sc-if value="{{ t.playing }}" hint-placeholder-val="{{ false }}">
<svg width="8" height="10" viewBox="1.6 0 7.4 10" aria-hidden="true"><path d="M2.2 1.3v7.4L8.5 5z" style="fill: var(--acp); stroke: var(--acp)" stroke-width="1.2" stroke-linejoin="round"></path></svg>
</sc-if>
<span style="min-width: 18px; text-align: right">{{ t.n }}</span>
</span>
<span style="overflow: hidden; text-overflow: ellipsis; font-size: 16px; color: {{ t.fg }}">{{ t.title }}</span>
<span style="text-align: right; font-variant-numeric: tabular-nums">{{ t.time }}</span>
</div>
</sc-for>
</div>
</div>
<dc-import name="AF Mini Player" hint-size="100%,70px"></dc-import>
<div style="height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><div style="width: 108px; height: 4px; border-radius: 2px; background: var(--tm)"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:384,&quot;height&quot;:832}}">
class Component extends DCLogic {
  renderVals() {
    const rows = [
      ['Sunlight Through Static', '4:31', 1, 'FLAC'], ['Memory Card', '3:34', 1, 'FLAC'], ['Polygon Weather', '5:32', 1, 'FLAC'],
      ['Low Poly Sunrise', '4:49', 1, 'DSD'], ['Analogue Stick', '3:18', 1, 'FLAC'], ['Wireframe Hymn', '6:41', 2, 'FLAC'],
      ['Disc Read Error', '2:56', 2, 'MP3'], ['Grey Plastic', '4:03', 2, 'FLAC'], ['Startup Chime', '1:28', 2, 'FLAC'], ['Second Sight', '6:06', 2, 'FLAC']
    ];
    return {
      tracks: rows.map(([title, time, disc, kind], i) => {
        const np = i === 2;
        return {
          n: i + 1, title, time, disc, kind, playing: np,
          bg: np ? 'var(--npbg)' : 'transparent', weight: np ? 600 : 400,
          fg: np ? 'var(--acpt)' : 'var(--tp)', sub: np ? 'var(--acpt)' : 'var(--ts)', num: np ? 'var(--acpt)' : 'var(--tm)'
        };
      })
    };
  }
}
</script>
</body>
</html>
